# Runs Codex App's tests on Windows and Linux for every pull request and every push to main.
# The tests use a fake Codex, so no OpenAI key is needed and nothing is billed.
name: tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CODEX_APP_TEST_REAL_SCHEDULER: "yes"  # the runner is throwaway: add and remove one real scheduled task
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install -r requirements.txt
          python -m pip install playwright  # for the built-in browser's tests (uses the runner's Edge or Chrome)

      - name: Git identity for the tests' throwaway repositories
        run: |
          git config --global user.name "Codex App tests"
          git config --global user.email "tests@example.com"
          git config --global init.defaultBranch main

      - name: Tests
        if: runner.os == 'Windows'
        run: python -m pytest -q

      - name: Tests, with a coverage report (which code no test runs)
        if: runner.os == 'Linux'
        run: |
          python -m pip install pytest-cov
          python -m pytest -q --cov=codex_app --cov=main --cov-report=term-missing:skip-covered

      - name: Self-test (offline checks)
        run: python main.py --selftest --offline
